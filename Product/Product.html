<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produk Link List</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background-color: #f5f1ea;
        font-family: "Lato", sans-serif;
        display: flex;
        justify-content: center;
        padding: 20px;
        margin: 0;
      }

      .container {
        width: 100%;
        max-width: 800px;
        background-color: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        overflow-y: auto;
        max-height: 600px;
        padding: 16px;
        border-radius: 10px;
      }

      .item {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 24px;
        text-decoration: none;
        color: inherit;
        flex-wrap: wrap;
      }

      .item.reverse {
        flex-direction: row-reverse;
      }

      .item img {
        width: 100%;
        max-width: 150px;
        height: auto;
        object-fit: cover;
        border-radius: 8px;
      }

      .item-info {
        flex: 1;
        text-align: left;
        min-width: 0;
      }

      .item-info h4 {
        margin: 8px 0;
        font-size: 4vw;
        font-family: "Lato", sans-serif;
        font-weight: 600;
        font-style: italic;
        letter-spacing: 0.5px;
        word-break: break-word;
      }

      .item-info p {
        margin: 4px 0;
        font-size: 3.8vw;
        font-style: italic;
      }

      .item-info span {
        color: black;
        font-weight: bold;
        text-decoration: underline;
        font-size: 3.8vw;
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-size: 4.5vw;
        text-align: center;
        margin-bottom: 24px;
        line-height: 1.4;
      }

      hr {
        border: none;
        border-top: 1px solid #222;
        margin: 16px 0;
      }

      @media (min-width: 600px) {
        .item-info h4,
        .item-info p,
        .item-info span {
          font-size: 16px;
        }

        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container" id="produkList">
      <h1><i>Nomor link diurutkan dari yg terbesar - kecil ya💞</i></h1>
      <hr />
    </div>

    <script>
      const produkData = [
        {
          judul: "580. Bed topper magnetik",
          deskripsi: "Alas kasur tambahan melancarkan sirkulasi darah",
          gambar:
            "https://down-id.img.susercontent.com/file/id-11134207-7rasc-m2hqjn4n146sd7.webp",
          link: "https://shopee.co.id/link-bed-topper",
          label: "Klik di sini beli bed topper",
        },
        {
          judul: "579. Smartlock face",
          deskripsi: "Buka kunci sidik jari, kartu, password, dan aplikasi",
          gambar:
            "https://down-id.img.susercontent.com/file/id-11134207-7rasc-m2hqjn4n146sd7.webp",
          link: "https://shopee.co.id/link-smartlock-face",
          label: "Klik di sini beli smartlock face",
        },
        {
          judul: "578. Kasur angin portable",
          deskripsi: "Kasur nyaman dan mudah dibawa ke mana-mana",
          gambar:
            "https://down-id.img.susercontent.com/file/id-11134207-7rasc-m2hqjn4n146sd7.webp",
          link: "https://shopee.co.id/link-kasur-angin",
          label: "Klik di sini beli kasur angin",
        },
        {
          judul: "577. Bantal leher ergonomis",
          deskripsi: "Nyaman untuk perjalanan dan kerja lama",
          gambar:
            "https://down-id.img.susercontent.com/file/id-11134207-7rasc-m2hqjn4n146sd7.webp",
          link: "https://shopee.co.id/link-bantal-leher",
          label: "Klik di sini beli bantal leher",
        },
      ];

      const container = document.getElementById("produkList");

      produkData.forEach((produk, index) => {
        const item = document.createElement("a");
        item.href = produk.link;
        item.target = "_blank";
        item.className = "item";

        if (index % 2 === 1) {
          item.classList.add("reverse");
        }

        item.innerHTML = `
          <img src="${produk.gambar}" alt="${produk.judul}" />
          <div class="item-info">
            <h4>${produk.judul}</h4>
            <p>${produk.deskripsi}</p>
            <span>${produk.label}</span>
          </div>
        `;

        container.appendChild(item);
        const hr = document.createElement("hr");
        container.appendChild(hr);
      });
    </script>
  </body>
</html>
