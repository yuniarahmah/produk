<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produk Link List</title>

    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f5f1ea;
        font-family: "Lato", sans-serif; /* Ganti ke Lato */
        display: flex;
        justify-content: center;
        padding: 40px;
      }

      .container {
        width: 390px;
        background-color: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        overflow-y: auto;
        max-height: 600px;
        padding: 16px;
      }

      .item {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 30px;
        text-decoration: none;
        color: inherit;
      }

      .item.reverse {
        flex-direction: row-reverse;
      }

      .item img {
        width: 150px;
        height: auto;
        object-fit: cover;
        border-radius: 8px;
      }

      .item-info {
        flex: 1;
        text-align: left;
      }

      .item-info h4 {
        margin: 0;
        font-size: 18px;
        margin-top: 5%;
        margin-bottom: 5%;
        font-family: "Lato", sans-serif;
        font-weight: 500;
        font-style: italic;
        letter-spacing: 1px;

        white-space: nowrap; /* TIDAK membungkus ke baris baru */
        overflow: hidden; /* Sembunyikan teks yang kepanjangan */
        text-overflow: ellipsis; /* Tampilkan "..." jika terlalu panjang */
      }

      .item-info p {
        margin: 4px 0;
        font-size: 15px;
        font-family: "Lato", sans-serif;
        /* font-weight: 600; */
        font-style: italic;
        margin-top: 5%;
        margin-bottom: 5%;
        /* font-weight: lighter; */
      }

      .item-info span {
        /* font-weight: 200px; */
        color: black;
        margin-top: 5%;
        margin-bottom: 5%;
        text-decoration: underline;
        font-weight: bolder;
      }

      h2 {
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-size: 20px;
        margin-bottom: 10%;
        text-align: center;
        line-height: 1.4;
      }

      hr {
        border: none;
        border-top: 1px solid #222;
        margin: 16px 0;
        width: 20vw; /* Setengah dari lebar viewport */
        margin-left: 0; /* Mulai dari pojok kiri */
      }
    </style>
  </head>
  <body>
    <div class="container" id="produkList">
      <div class="katalog">
        <div class="">
          <h1><i> Nomor link diurutkan dari yg terbesar - kecil ya💞</i></h1>
        </div>
      </div>

      <hr />
    </div>

    <script>
      const produkData = [
        {
          judul: "580. Bed topper magnetik",
          deskripsi: "Alas kasur tambahan melancarkan sirkulasi darah",
          gambar:
            "https://down-id.img.susercontent.com/file/id-11134207-7rasc-m2hqjn4n146sd7.webp",
          link: "https://shopee.co.id/link-bed-topper",
          label: "Klik di sini beli bed topper",
        },
        {
          judul: "579. Smartlock face",
          deskripsi: "Buka kunci sidik jari, kartu, password, dan aplikasi",
          gambar:
            "https://down-id.img.susercontent.com/file/id-11134207-7rasc-m2hqjn4n146sd7.webp",
          link: "https://shopee.co.id/link-smartlock-face",
          label: "Klik di sini beli smartlock face",
        },
        {
          judul: "578. Kasur angin portable",
          deskripsi: "Kasur nyaman dan mudah dibawa ke mana-mana",
          gambar:
            "https://down-id.img.susercontent.com/file/id-11134207-7rasc-m2hqjn4n146sd7.webp",
          link: "https://shopee.co.id/link-kasur-angin",
          label: "Klik di sini beli kasur angin",
        },
        {
          judul: "579. Smartlock face",
          deskripsi: "Buka kunci sidik jari, kartu, password, dan aplikasi",
          gambar:
            "https://down-id.img.susercontent.com/file/id-11134207-7rasc-m2hqjn4n146sd7.webp",
          link: "https://shopee.co.id/link-smartlock-face",
          label: "Klik di sini beli smartlock face",
        },
        {
          judul: "579. Smartlock face",
          deskripsi: "Buka kunci sidik jari, kartu, password, dan aplikasi",
          gambar:
            "https://down-id.img.susercontent.com/file/id-11134207-7rasc-m2hqjn4n146sd7.webp",
          link: "https://shopee.co.id/link-smartlock-face",
          label: "Klik di sini beli smartlock face",
        },
        {
          judul: "579. Smartlock face",
          deskripsi: "Buka kunci sidik jari, kartu, password, dan aplikasi",
          gambar:
            "https://down-id.img.susercontent.com/file/id-11134207-7rasc-m2hqjn4n146sd7.webp",
          link: "https://shopee.co.id/link-smartlock-face",
          label: "Klik di sini beli smartlock face",
        },
        {
          judul: "579. Smartlock face",
          deskripsi: "Buka kunci sidik jari, kartu, password, dan aplikasi",
          gambar:
            "https://down-id.img.susercontent.com/file/id-11134207-7rasc-m2hqjn4n146sd7.webp",
          link: "https://shopee.co.id/link-smartlock-face",
          label: "Klik di sini beli smartlock face",
        },
      ];

      const container = document.getElementById("produkList");

      // Tambahkan garis pembuka sebelum daftar dimulai
      const hrAwal = document.createElement("hr");
      container.appendChild(hrAwal);

      produkData.forEach((produk, index) => {
        const item = document.createElement("a");
        item.href = produk.link;
        item.target = "_blank";
        item.className = "item";

        if (index % 2 === 1) {
          item.classList.add("reverse");
        }

        item.innerHTML = `
    <img src="${produk.gambar}" alt="${produk.judul}" />
    <div class="item-info">
      <h4>${produk.judul}</h4>
      <p>${produk.deskripsi}</p>
      <span>${produk.label}</span>
    </div>
  `;

        container.appendChild(item);

        // Tambahkan garis setelah setiap item
        const hr = document.createElement("hr");
        container.appendChild(hr);
      });
    </script>
  </body>
</html>
